# AWS Lambda deployment via the Serverless Framework (v3).
# Run from apps/api/ — see infra/README.md for full setup + deploy steps.
#
#   npm install -g serverless
#   cd apps/api && serverless deploy --config ../../infra/serverless.yml
#
# This deploys ONLY the Node API as a zip-packaged Lambda behind an HTTP
# API Gateway. The AI service is deployed separately as a container-image
# Lambda (infra/serverless-ai.yml) since its native deps (psycopg2, etc.)
# don't play nicely with the zip packaging path.

service: retainai-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29 # API Gateway's hard cap for a single request
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    AI_SERVICE_URL: ${env:AI_SERVICE_URL}
    SHOPIFY_API_KEY: ${env:SHOPIFY_API_KEY, ''}
    SHOPIFY_API_SECRET: ${env:SHOPIFY_API_SECRET, ''}
    SHOPIFY_SCOPES: ${env:SHOPIFY_SCOPES, 'read_orders,write_orders,read_inventory,write_inventory,read_products'}
    SHOPIFY_APP_URL: ${env:SHOPIFY_APP_URL}
    SHOPIFY_MODE: ${env:SHOPIFY_MODE, 'mock'}
    DHL_MODE: ${env:DHL_MODE, 'mock'}
    DHL_API_KEY: ${env:DHL_API_KEY, ''}
    DHL_API_SECRET: ${env:DHL_API_SECRET, ''}
    FEDEX_MODE: ${env:FEDEX_MODE, 'mock'}
    FEDEX_CLIENT_ID: ${env:FEDEX_CLIENT_ID, ''}
    FEDEX_CLIENT_SECRET: ${env:FEDEX_CLIENT_SECRET, ''}
    UPS_MODE: ${env:UPS_MODE, 'mock'}
    UPS_CLIENT_ID: ${env:UPS_CLIENT_ID, ''}
    UPS_CLIENT_SECRET: ${env:UPS_CLIENT_SECRET, ''}
    JWT_SECRET: ${env:JWT_SECRET}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: "*"

package:
  patterns:
    - "dist/**"
    - "node_modules/**"
    - "!node_modules/@types/**"
    - "!**/*.ts"
